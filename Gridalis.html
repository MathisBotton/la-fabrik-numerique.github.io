<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let img = null;
let cols = 6, rows = 6;
let xs = [], ys = [];
let mergeGroups = [];
let cellMergeMap = {};
let selectedCells = new Set();

const canvas      = document.getElementById('gridCanvas');
const ctx         = canvas.getContext('2d');
const dropZone    = document.getElementById('dropZone');
const gridWrapper = document.getElementById('gridWrapper');
const fileInput   = document.getElementById('fileInput');
const colSlider   = document.getElementById('colSlider');
const rowSlider   = document.getElementById('rowSlider');
const colVal      = document.getElementById('colVal');
const rowVal      = document.getElementById('rowVal');
const selCount    = document.getElementById('selCount');
const mergeBtn    = document.getElementById('mergeBtn');
const unmergeBtn  = document.getElementById('unmergeBtn');
const randSlider  = document.getElementById('randSlider');
const randVal     = document.getElementById('randVal');

// ─── UTILS ────────────────────────────────────────────────────────────────────
function initGrid() {
  xs = []; ys = [];
  for (let i = 0; i <= cols; i++) xs.push(i / cols);
  for (let j = 0; j <= rows; j++) ys.push(j / rows);
  mergeGroups = [];
  cellMergeMap = {};
  selectedCells = new Set();
  updateMergeUI();
  updateStatusBar();
}

function resetGridLines() {
  for (let i = 0; i <= cols; i++) xs[i] = i / cols;
  for (let j = 0; j <= rows; j++) ys[j] = j / rows;
}

function clampGrid() {
  for (let i = 1; i < xs.length - 1; i++) {
    xs[i] = Math.max(xs[i-1] + 0.005, Math.min(xs[i+1] - 0.005, xs[i]));
  }
  for (let j = 1; j < ys.length - 1; j++) {
    ys[j] = Math.max(ys[j-1] + 0.005, Math.min(ys[j+1] - 0.005, ys[j]));
  }
}

function cellKey(r, c) { return `${r},${c}`; }

function getMergeGroup(r, c) {
  const k = cellKey(r, c);
  const idx = cellMergeMap[k];
  return (idx !== undefined) ? mergeGroups[idx] : null;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  if (!img) return;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const drawn = new Set();

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const k = cellKey(r, c);
      if (drawn.has(k)) continue;

      const mg = getMergeGroup(r, c);
      let minR = r, maxR = r, minC = c, maxC = c;
      if (mg) {
        minR = mg.minR; maxR = mg.maxR; minC = mg.minC; maxC = mg.maxC;
        mg.cells.forEach(ck => drawn.add(ck));
      } else {
        drawn.add(k);
      }

      // Destination (warped grid positions)
      const dx = xs[minC] * W;
      const dy = ys[minR] * H;
      const dw = xs[maxC+1] * W - dx;
      const dh = ys[maxR+1] * H - dy;

      // Source (uniform grid positions in original image)
      const sx = (minC / cols) * img.width;
      const sy = (minR / rows) * img.height;
      const sw = ((maxC+1) / cols) * img.width - sx;
      const sh = ((maxR+1) / rows) * img.height - sy;

      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);

      // Selection highlight
      const isSelected = selectedCells.has(k) || (mg && [...mg.cells].some(ck => selectedCells.has(ck)));
      if (isSelected) {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(dx, dy, dw, dh);
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.strokeRect(dx+1, dy+1, dw-2, dh-2);
      }

      // Merged highlight
      if (mg && !isSelected) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(dx, dy, dw, dh);
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4,4]);
        ctx.strokeRect(dx+1, dy+1, dw-2, dh-2);
        ctx.setLineDash([]);
      }
    }
    
  }

  // Grid lines
  ctx.strokeStyle = 'rgba(0,0,0,1)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  for (let i = 1; i < xs.length - 1; i++) {
    const x = xs[i] * W;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let j = 1; j < ys.length - 1; j++) {
    const y = ys[j] * H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Border
  ctx.strokeStyle = 'rgba(232,255,69,0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, W, H);
}

// ─── LOAD IMAGE ───────────────────────────────────────────────────────────────
function loadImage(src) {
  const i = new Image();
  i.onload = () => {
    img = i;
    const area = document.getElementById('canvasArea');
    const maxW = area.clientWidth - 40;
    const maxH = area.clientHeight - 40;
    const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
    canvas.width  = Math.round(img.width * ratio);
    canvas.height = Math.round(img.height * ratio);

    dropZone.style.display  = 'none';
    gridWrapper.style.display = 'block';
    document.getElementById('exportBtn').disabled = false;
    document.getElementById('dotImg').classList.add('active');
    document.getElementById('dimInfo').textContent = `${img.width} × ${img.height} px`;
    document.getElementById('statusMode').textContent = 'Mode : Sélection';
    document.getElementById('statusMode').className = 'mode-indicator mode-select';

    initGrid();
    render();
  };
  i.src = src;
}

// ─── FILE / DROP ──────────────────────────────────────────────────────────────
dropZone.addEventListener('click', () => fileInput.click());
document.getElementById('importBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) {
    const r = new FileReader();
    r.onload = ev => loadImage(ev.target.result);
    r.readAsDataURL(e.target.files[0]);
    e.target.value = '';
    document.getElementById("import-informations").remove();
  }
});

const ca = document.getElementById('canvasArea');
ca.addEventListener('dragover', e => { e.preventDefault(); if (!img) dropZone.classList.add('drag-over'); });
ca.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
ca.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) {
    const r = new FileReader();
    r.onload = ev => loadImage(ev.target.result);
    r.readAsDataURL(e.dataTransfer.files[0]);
  }
});

// ─── SLIDERS ──────────────────────────────────────────────────────────────────
colSlider.addEventListener('input', () => {
  cols = +colSlider.value; colVal.textContent = cols;
  if (img) { initGrid(); render(); }
});
rowSlider.addEventListener('input', () => {
  rows = +rowSlider.value; rowVal.textContent = rows;
  if (img) { initGrid(); render(); }
});
randSlider.addEventListener('input', () => { randVal.textContent = randSlider.value; });

// ─── CANVAS CLICK — CELL SELECTION ───────────────────────────────────────────
canvas.addEventListener('click', e => {
  if (!img) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / canvas.width;
  const my = (e.clientY - rect.top)  / canvas.height;

  let c = -1, r = -1;
  for (let i = 0; i < cols; i++) if (mx >= xs[i] && mx < xs[i+1]) { c = i; break; }
  for (let j = 0; j < rows; j++) if (my >= ys[j] && my < ys[j+1]) { r = j; break; }
  if (r < 0 || c < 0) return;

  const k  = cellKey(r, c);
  const mg = getMergeGroup(r, c);

  if (mg) {
    const anySelected = [...mg.cells].some(ck => selectedCells.has(ck));
    if (anySelected) mg.cells.forEach(ck => selectedCells.delete(ck));
    else             mg.cells.forEach(ck => selectedCells.add(ck));
  } else {
    if (selectedCells.has(k)) selectedCells.delete(k);
    else selectedCells.add(k);
  }

  updateMergeUI();
  render();
});

// ─── MERGE ────────────────────────────────────────────────────────────────────
mergeBtn.addEventListener('click', () => {
  if (selectedCells.size < 2) return;

  const cells = [...selectedCells].map(k => {
    const [r,c] = k.split(',').map(Number); return {r,c};
  });
  const minR = Math.min(...cells.map(c=>c.r));
  const maxR = Math.max(...cells.map(c=>c.r));
  const minC = Math.min(...cells.map(c=>c.c));
  const maxC = Math.max(...cells.map(c=>c.c));

  // Remove existing groups for selected cells
  const indicesToRemove = new Set();
  [...selectedCells].forEach(k => {
    if (cellMergeMap[k] !== undefined) indicesToRemove.add(cellMergeMap[k]);
  });
  indicesToRemove.forEach(idx => { mergeGroups[idx] = null; });
  indicesToRemove.forEach(idx => {
    Object.keys(cellMergeMap).forEach(k => { if (cellMergeMap[k] === idx) delete cellMergeMap[k]; });
  });

  // Build new group from bounding rect
  const newGroupCells = new Set();
  for (let r = minR; r <= maxR; r++)
    for (let c = minC; c <= maxC; c++)
      newGroupCells.add(cellKey(r, c));

  const newGroup = { cells: newGroupCells, minR, maxR, minC, maxC };
  let slot = mergeGroups.findIndex(g => g === null);
  if (slot === -1) { mergeGroups.push(newGroup); slot = mergeGroups.length - 1; }
  else mergeGroups[slot] = newGroup;

  newGroupCells.forEach(k => { cellMergeMap[k] = slot; });

  selectedCells.clear();
  updateMergeUI();
  updateStatusBar();
  render();
});

unmergeBtn.addEventListener('click', () => {
  mergeGroups = [];
  cellMergeMap = {};
  selectedCells.clear();
  updateMergeUI();
  updateStatusBar();
  render();
});

function updateMergeUI() {
  const n = selectedCells.size;
  selCount.textContent = n;
  mergeBtn.disabled    = n < 2;
  const hasMerges      = mergeGroups.some(g => g !== null);
  unmergeBtn.disabled  = !hasMerges;
}

function updateStatusBar() {
  document.getElementById('gridInfo').textContent  = `Grille : ${cols} × ${rows}`;
  const cnt = mergeGroups.filter(g => g !== null).length;
  document.getElementById('mergeInfo').textContent = `Fusions : ${cnt}`;
}

// ─── RANDOM DEFORMATION ───────────────────────────────────────────────────────
document.getElementById('randomBtn').addEventListener('click', () => {
  if (!img) return;
  const strength = +randSlider.value / 100;

  // Lock lines that are boundaries of merged groups
  const lockedX = new Set();
  const lockedY = new Set();
  mergeGroups.filter(g => g !== null).forEach(g => {
    lockedX.add(g.minC); lockedX.add(g.maxC+1);
    lockedY.add(g.minR); lockedY.add(g.maxR+1);
  });

  for (let i = 1; i < xs.length - 1; i++) {
    if (lockedX.has(i)) continue;
    const base     = i / cols;
    const maxDelta = (1 / cols) * 0.7 * strength;
    xs[i] = base + (Math.random() * 2 - 1) * maxDelta;
    xs[i] = Math.max(xs[i-1] + 0.01, Math.min(1 - (xs.length - 1 - i) * 0.01, xs[i]));
  }
  for (let j = 1; j < ys.length - 1; j++) {
    if (lockedY.has(j)) continue;
    const base     = j / rows;
    const maxDelta = (1 / rows) * 0.7 * strength;
    ys[j] = base + (Math.random() * 2 - 1) * maxDelta;
    ys[j] = Math.max(ys[j-1] + 0.01, Math.min(1 - (ys.length - 1 - j) * 0.01, ys[j]));
  }
  clampGrid();
  render();
});

// ─── RESET GRID ───────────────────────────────────────────────────────────────
document.getElementById('resetGridBtn').addEventListener('click', () => {
  if (!img) return;
  resetGridLines();
  render();
});

// ─── EXPORT ───────────────────────────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  if (!img) return;

  const oc = document.createElement('canvas');
  oc.width = img.width; oc.height = img.height;
  const oc_ctx = oc.getContext('2d');
  const W = img.width, H = img.height;

  const drawn = new Set();
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const k = cellKey(r, c);
      if (drawn.has(k)) continue;
      const mg = getMergeGroup(r, c);
      let minR = r, maxR = r, minC = c, maxC = c;
      if (mg) {
        minR=mg.minR; maxR=mg.maxR; minC=mg.minC; maxC=mg.maxC;
        mg.cells.forEach(ck => drawn.add(ck));
      } else {
        drawn.add(k);
      }

      const dx = xs[minC] * W, dy = ys[minR] * H;
      const dw = xs[maxC+1]*W - dx, dh = ys[maxR+1]*H - dy;
      const sx = (minC/cols)*img.width, sy = (minR/rows)*img.height;
      const sw = ((maxC+1)/cols)*img.width - sx, sh = ((maxR+1)/rows)*img.height - sy;

      oc_ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    }
  }

  const link = document.createElement('a');
  link.download = 'gridwarp-export.png';
  link.href     = oc.toDataURL('image/png');
  link.click();
});
</script>
