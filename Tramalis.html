<script>
let imgSource = null;
let imgPattern = null;
let imgPatternBuffer = null;
let showImage = true;

// buffer image (IMPORTANT)
let pg;

let offsets = [];
let rotations = [];

// ─── BLEND MODES ─────────────────────────────────────────────────────────────
// Utilise les constantes p5.js directement, pas window[string]
// Les constantes p5 sont disponibles globalement après le chargement de p5.js
let blendModeList = [
  { label: "Normal",        getMode: () => BLEND      },
  { label: "Superposition", getMode: () => OVERLAY    },
  { label: "Produit",       getMode: () => MULTIPLY   },
  { label: "Différence",    getMode: () => DIFFERENCE },
  { label: "Écran",         getMode: () => SCREEN     },
];
let currentBlendIndex = 0;

// DOM
const sizeSlider      = document.getElementById("sizeSlider");
const randomSlider    = document.getElementById("randomSlider");
const rotationSlider  = document.getElementById("rotationSlider");
const patternSelect   = document.getElementById("patternSelect");
const thresholdSlider = document.getElementById("thresholdSlider");
const toggleImageBtn  = document.getElementById("toggleImageBtn");
const widthSlider     = document.getElementById("widthSlider");
const heightSlider    = document.getElementById("heightSlider");

const fileMain    = document.getElementById("fileMain");
const filePattern = document.getElementById("filePattern");

const containerSize   = document.getElementById('p5-container');
const containerWidth  = containerSize.offsetWidth;
const containerHeight = containerSize.offsetHeight;

const sizeVal      = document.getElementById("sizeVal");
const thresholdVal = document.getElementById("thresholdVal");
const widthVal     = document.getElementById("widthVal");
const heightVal    = document.getElementById("heightVal");
const randomVal    = document.getElementById("randomVal");
const rotationVal  = document.getElementById("rotationVal");

// ─── SLIDERS ──────────────────────────────────────────────────────────────────
sizeSlider.addEventListener('input', () => {
  sizeVal.textContent = sizeSlider.value;
  if (imgSource) { generateOffsets(); }
});

randomSlider.addEventListener('input', () => {
  randomVal.textContent = randomSlider.value;
  if (imgSource) { generateOffsets(); }
});

rotationSlider.addEventListener('input', () => {
  rotationVal.textContent = rotationSlider.value;
  if (imgSource) { generateOffsets(); }
});

thresholdSlider.addEventListener("input", () => {
  thresholdVal.textContent = thresholdSlider.value;
});

widthSlider.addEventListener('input', () => {
  widthVal.textContent = widthSlider.value;
});

heightSlider.addEventListener('input', () => {
  heightVal.textContent = heightSlider.value;
});

toggleImageBtn.onclick = function () {
  showImage = !showImage;
  this.textContent = showImage ? "Image : Visible" : "Image : Cachée";
};

// ───────────────────────────
// FILE INPUTS
// ───────────────────────────
document.getElementById("importBtn").onclick   = () => fileMain.click();
document.getElementById("uploadPattern").onclick = () => filePattern.click();

fileMain.onchange = e => {
  const file = e.target.files[0];
  if (file) {
    loadImage(URL.createObjectURL(file), img => {
      imgSource = img;

      pg = createGraphics(img.width, img.height);
      pg.pixelDensity(1);

      resizeCanvasToContainer();

      const info = document.getElementById("import-informations");
      if (info) info.remove();
    });
  }
};

filePattern.onchange = e => {
  const file = e.target.files[0];
  if (file) {
    loadImage(URL.createObjectURL(file), img => {
      imgPattern = img;
      imgPatternBuffer = createGraphics(50, 50);
      imgPatternBuffer.imageMode(CENTER);
      imgPatternBuffer.image(imgPattern, 25, 25, 50, 50);
    });
  }
};

// ───────────────────────────
// UI EVENTS
// ───────────────────────────
document.getElementById("blendBtn").onclick = function () {
  currentBlendIndex = (currentBlendIndex + 1) % blendModeList.length;
  this.textContent = "Mode : " + blendModeList[currentBlendIndex].label;
};

document.getElementById("exportBtn").onclick = () => {
  exportHighRes();
};

document.getElementById("exportSVGBtn").onclick = () => {
  exportSVG();
};

// ───────────────────────────
// SETUP
// ───────────────────────────
function setup() {
  let canvas = createCanvas(containerWidth, containerHeight);
  canvas.parent("p5-container");
  pixelDensity(1);
}

// ───────────────────────────
// RESIZE CANVAS
// ───────────────────────────
function resizeCanvasToContainer() {
  if (!imgSource) return;

  const container  = document.querySelector(".canvas-area");

  const maxW = container.clientWidth  - 40;
  const maxH = container.clientHeight - 40;

  const ratio = Math.min(maxW / imgSource.width, maxH / imgSource.height, 1);

  const newW = Math.floor(imgSource.width  * ratio);
  const newH = Math.floor(imgSource.height * ratio);

  resizeCanvas(newW, newH);

  const p5Container = document.getElementById("p5-container");
  p5Container.style.width  = newW + "px";
  p5Container.style.height = newH + "px";

  generateOffsets();
}

window.addEventListener("resize", resizeCanvasToContainer);

// ───────────────────────────
// OFFSETS
// ───────────────────────────
function generateOffsets() {
  if (!imgSource) return;

  offsets   = [];
  rotations = [];

  let step       = parseInt(sizeSlider.value);
  let randomness = parseInt(randomSlider.value);
  let rotation   = parseInt(rotationSlider.value);

  for (let x = 0; x < width; x += step) {
    let row    = [];
    let rowRot = [];

    for (let y = 0; y < height; y += step) {
      row.push({
        x: random(-randomness, randomness),
        y: random(-randomness, randomness)
      });
      rowRot.push(random(-rotation, rotation));
    }

    offsets.push(row);
    rotations.push(rowRot);
  }
}

// ───────────────────────────
// DRAW
// ───────────────────────────
function draw() {
  if (!imgSource || !pg) return;
  if (offsets.length === 0) return;

  let step        = parseInt(sizeSlider.value);
  let patternType = patternSelect.value;

  // --- BUFFER
  pg.background(255);
  pg.imageMode(CENTER);
  pg.image(imgSource, pg.width / 2, pg.height / 2);
  pg.loadPixels();

  // --- FOND toujours blanc
  background(255);

  // --- IMAGE (uniquement si visible)
  if (showImage) {
    let ratio = min(width / imgSource.width, height / imgSource.height);
    let w     = imgSource.width  * ratio;
    let h     = imgSource.height * ratio;
    imageMode(CENTER);
    blendMode(BLEND);
    image(imgSource, width / 2, height / 2, w, h);
  }

  // --- TRAME (toujours dessinée)
  blendMode(blendModeList[currentBlendIndex].getMode());
  drawLayer(step, patternType);
  blendMode(BLEND);
}

// ───────────────────────────
// DRAW LAYER (BUFFER-BASED)
// ───────────────────────────
function drawLayer(step, patternType) {
  let xi = 0;

  for (let x = 0; x < width; x += step) {
    let yi = 0;

    for (let y = 0; y < height; y += step) {

      // FIX : utilise p5.map() natif (pas notre ancienne fonction mapRange)
      let bx = Math.floor(p5.prototype.map ? map(x, 0, width, 0, pg.width) : mapRange(x, 0, width, 0, pg.width));
      let by = Math.floor(p5.prototype.map ? map(y, 0, height, 0, pg.height) : mapRange(y, 0, height, 0, pg.height));

      let index = 4 * (bx + by * pg.width);

      let r = pg.pixels[index];
      let g = pg.pixels[index + 1];
      let b = pg.pixels[index + 2];

      let brightness = (r + g + b) / 3;
      let threshold  = parseInt(thresholdSlider.value);

      if (brightness < threshold) {
        let off = offsets[xi][yi];
        let rot = rotations[xi][yi];

        push();
        translate(x + off.x, y + off.y);
        rotate(radians(rot));
        drawPattern(patternType, step);
        pop();
      }

      yi++;
    }

    xi++;
  }
}

// ───────────────────────────
// PATTERNS (screen render)
// ───────────────────────────
function drawPattern(type, size) {
  let pw = parseFloat(widthSlider.value);
  let ph = parseFloat(heightSlider.value);

  noStroke();
  fill(0);

  if (type === "circle") {
    ellipse(0, 0, pw, ph);
  }
  else if (type === "square") {
    rectMode(CENTER);
    rect(0, 0, pw, ph);
  }
  else if (type === "triangle") {
    triangle(-pw / 2, ph / 2, 0, -ph / 2, pw / 2, ph / 2);
  }
  else if (type === "hex") {
    beginShape();
    for (let a = 0; a < TWO_PI; a += TWO_PI / 6) {
      vertex(cos(a) * pw / 2, sin(a) * ph / 2);
    }
    endShape(CLOSE);
  }
  else if (type === "image" && imgPatternBuffer) {
    imageMode(CENTER);
    image(imgPatternBuffer, 0, 0, pw, ph);
  }
  else if (type === "randomShape") {
    beginShape();
    let points = floor(random(5, 12));
    for (let i = 0; i < points; i++) {
      let a  = i * TWO_PI / points;
      let rX = (pw / 2) * random(0.5, 1);
      let rY = (ph / 2) * random(0.5, 1);
      vertex(cos(a) * rX, sin(a) * rY);
    }
    endShape(CLOSE);
  }
}

// ───────────────────────────
// EXPORT PNG HAUTE RÉSOLUTION
// ───────────────────────────
function exportHighRes() {
  if (!imgSource) return;

  let scale   = parseInt(document.getElementById("exportScale").value);
  let exportW = imgSource.width  * scale;
  let exportH = imgSource.height * scale;

  let exportPg = createGraphics(exportW, exportH);
  exportPg.pixelDensity(1);

  let exportBuffer = createGraphics(imgSource.width, imgSource.height);
  exportBuffer.pixelDensity(1);
  exportBuffer.imageMode(CENTER);
  exportBuffer.image(imgSource, imgSource.width / 2, imgSource.height / 2);
  exportBuffer.loadPixels();

  let step        = parseInt(sizeSlider.value);
  let patternType = patternSelect.value;

  let screenToExportRatio = exportW / width;

  let pw = parseFloat(widthSlider.value)  * screenToExportRatio;
  let ph = parseFloat(heightSlider.value) * screenToExportRatio;
  let stepExport = step * screenToExportRatio;

  exportPg.background(255);

  if (showImage) {
    exportPg.imageMode(CENTER);
    exportPg.image(imgSource, exportW / 2, exportH / 2, exportW, exportH);
  }

  // FIX : utilise la constante p5 via getMode()
  exportPg.blendMode(blendModeList[currentBlendIndex].getMode());

  let xi = 0;

  for (let x = 0; x < exportW; x += stepExport) {
    let yi = 0;

    for (let y = 0; y < exportH; y += stepExport) {

      let bx = Math.floor(mapRange(x, 0, exportW, 0, exportBuffer.width));
      let by = Math.floor(mapRange(y, 0, exportH, 0, exportBuffer.height));

      let index = 4 * (bx + by * exportBuffer.width);
      let r     = exportBuffer.pixels[index];
      let g     = exportBuffer.pixels[index + 1];
      let b     = exportBuffer.pixels[index + 2];

      let brightness = (r + g + b) / 3;

      if (brightness < parseFloat(thresholdSlider.value)) {

        let off = offsets[xi]?.[yi] || { x: 0, y: 0 };
        let rot = rotations[xi]?.[yi] || 0;

        exportPg.push();
        exportPg.translate(
          x + off.x * screenToExportRatio,
          y + off.y * screenToExportRatio
        );
        exportPg.rotate(radians(rot));
        drawPatternOnBuffer(exportPg, patternType, pw, ph);
        exportPg.pop();
      }

      yi++;
    }

    xi++;
  }

  exportPg.save("trame_HD.png");
}

// ───────────────────────────
// HELPER : dessine un pattern sur un graphics p5 arbitraire
// ───────────────────────────
function drawPatternOnBuffer(g, type, pw, ph) {
  g.noStroke();
  g.fill(0);

  if (type === "circle") {
    g.ellipse(0, 0, pw, ph);
  }
  else if (type === "square") {
    g.rectMode(CENTER);
    g.rect(0, 0, pw, ph);
  }
  else if (type === "triangle") {
    g.triangle(-pw / 2, ph / 2, 0, -ph / 2, pw / 2, ph / 2);
  }
  else if (type === "hex") {
    g.beginShape();
    for (let a = 0; a < Math.PI * 2; a += Math.PI * 2 / 6) {
      g.vertex(Math.cos(a) * pw / 2, Math.sin(a) * ph / 2);
    }
    g.endShape(CLOSE);
  }
  else if (type === "image" && imgPatternBuffer) {
    g.imageMode(CENTER);
    g.image(imgPatternBuffer, 0, 0, pw, ph);
  }
  else if (type === "randomShape") {
    g.beginShape();
    let points = Math.floor(Math.random() * 7) + 5;
    for (let i = 0; i < points; i++) {
      let a  = i * Math.PI * 2 / points;
      let rX = (pw / 2) * Math.random();
      let rY = (ph / 2) * Math.random();
      g.vertex(Math.cos(a) * rX, Math.sin(a) * rY);
    }
    g.endShape(CLOSE);
  }
}

// ───────────────────────────
// EXPORT SVG
// ───────────────────────────
function exportSVG() {
  if (!imgSource) return;

  let svgW = imgSource.width;
  let svgH = imgSource.height;

  let svgBuffer = createGraphics(svgW, svgH);
  svgBuffer.pixelDensity(1);
  svgBuffer.imageMode(CENTER);
  svgBuffer.image(imgSource, svgW / 2, svgH / 2);
  svgBuffer.loadPixels();

  let screenToSVGRatio = svgW / width;

  let step       = parseInt(sizeSlider.value);
  let stepSVG    = step * screenToSVGRatio;
  let pw         = parseFloat(widthSlider.value)  * screenToSVGRatio;
  let ph         = parseFloat(heightSlider.value) * screenToSVGRatio;
  let threshold  = parseFloat(thresholdSlider.value);
  let patternType = patternSelect.value;

  let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}">\n`;
  svgContent += `  <rect width="100%" height="100%" fill="white"/>\n`;

  let xi = 0;

  for (let x = 0; x < svgW; x += stepSVG) {
    let yi = 0;

    for (let y = 0; y < svgH; y += stepSVG) {

      let bx = Math.floor(mapRange(x, 0, svgW, 0, svgBuffer.width));
      let by = Math.floor(mapRange(y, 0, svgH, 0, svgBuffer.height));

      let index = 4 * (bx + by * svgBuffer.width);
      let r     = svgBuffer.pixels[index];
      let g     = svgBuffer.pixels[index + 1];
      let b     = svgBuffer.pixels[index + 2];

      let brightness = (r + g + b) / 3;

      if (brightness < threshold) {

        let off = offsets[xi]?.[yi] || { x: 0, y: 0 };
        let rot = rotations[xi]?.[yi] || 0;

        let px = x + off.x * screenToSVGRatio;
        let py = y + off.y * screenToSVGRatio;

        let rotDeg = rot.toFixed(2);
        let transform = `transform="translate(${px.toFixed(2)},${py.toFixed(2)}) rotate(${rotDeg})"`;

        svgContent += patternToSVG(patternType, pw, ph, transform);
      }

      yi++;
    }

    xi++;
  }

  svgContent += `</svg>`;

  let blob = new Blob([svgContent], { type: "image/svg+xml" });
  let url  = URL.createObjectURL(blob);
  let a    = document.createElement("a");
  a.href     = url;
  a.download = "trame.svg";
  a.click();
  URL.revokeObjectURL(url);
}

// ───────────────────────────
// HELPER : génère le fragment SVG pour un pattern
// ───────────────────────────
function patternToSVG(type, pw, ph, transform) {

  if (type === "circle") {
    return `  <ellipse ${transform} rx="${(pw / 2).toFixed(2)}" ry="${(ph / 2).toFixed(2)}" fill="black"/>\n`;
  }
  else if (type === "square") {
    return `  <rect ${transform} x="${(-pw / 2).toFixed(2)}" y="${(-ph / 2).toFixed(2)}" width="${pw.toFixed(2)}" height="${ph.toFixed(2)}" fill="black"/>\n`;
  }
  else if (type === "triangle") {
    let p1 = `${(-pw / 2).toFixed(2)},${(ph / 2).toFixed(2)}`;
    let p2 = `0,${(-ph / 2).toFixed(2)}`;
    let p3 = `${(pw / 2).toFixed(2)},${(ph / 2).toFixed(2)}`;
    return `  <polygon ${transform} points="${p1} ${p2} ${p3}" fill="black"/>\n`;
  }
  else if (type === "hex") {
    let points = "";
    for (let a = 0; a < Math.PI * 2; a += Math.PI * 2 / 6) {
      let vx = (Math.cos(a) * pw / 2).toFixed(2);
      let vy = (Math.sin(a) * ph / 2).toFixed(2);
      points += `${vx},${vy} `;
    }
    return `  <polygon ${transform} points="${points.trim()}" fill="black"/>\n`;
  }
  else if (type === "randomShape") {
    return `  <ellipse ${transform} rx="${(pw / 2).toFixed(2)}" ry="${(ph / 2).toFixed(2)}" fill="black"/>\n`;
  }

  return "";
}

// ───────────────────────────
// FIX : renommée mapRange() pour éviter le conflit avec p5.map()
// Utilisée uniquement dans exportSVG et exportHighRes (hors contexte p5 draw)
// ───────────────────────────
function mapRange(value, start1, stop1, start2, stop2) {
  return start2 + (stop2 - start2) * ((value - start1) / (stop1 - start1));
}
</script>
